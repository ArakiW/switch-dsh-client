name: Build switch-dsh-client (.nro)

# 本地没有 devkitPro 时的编译验证通道:
# 推到 GitHub 后自动用 devkitpro/devkitarm 镜像交叉编译并产出 .nro。
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Switch libraries (portlibs)
        run: |
          dkp-pacman -S --noconfirm --needed \
            switch-sdl2 switch-sdl2_ttf switch-sdl2_image switch-sdl2_gfx \
            switch-curl switch-mbedtls \
            switch-freetype switch-harfbuzz switch-zlib switch-libpng \
            switch-libjpeg-turbo switch-bzip2

      - name: Build
        run: make -j$(nproc)

      - name: Upload .nro
        uses: actions/upload-artifact@v4
        with:
          name: switch-dsh-client
          path: switch-dsh-client.nro
