name: Build switch-dsh-client (.nro)

# 本地没有 devkitPro 时的编译验证通道:
# 推到 GitHub 后自动用 devkitpro/devkita64 镜像交叉编译并产出 .nro;
# 打 v* 标签时额外发布 GitHub Release(附 .nro 可直接装 SD 卡)。
on:
  push:
    tags:
      - 'v*'
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Switch libraries (portlibs)
        run: |
          dkp-pacman -S --noconfirm --needed \
            switch-sdl2 switch-sdl2_ttf switch-sdl2_image switch-sdl2_gfx \
            switch-curl switch-mbedtls \
            switch-freetype switch-harfbuzz switch-zlib switch-libpng \
            switch-libjpeg-turbo switch-bzip2

      - name: Build
        run: make -j$(nproc)

      - name: Upload .nro
        uses: actions/upload-artifact@v4
        with:
          name: switch-dsh-client
          path: switch-dsh-client.nro

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download .nro artifact
        uses: actions/download-artifact@v4
        with:
          name: switch-dsh-client
          path: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: switch-dsh-client.nro
          body: "Nintendo Switch 自制程序:DeepSeek AI 聊天客户端。含本地离线语音朗读(TTS)与语音输入(STT,需桥接 + whisper 服务)。将 .nro 放入 SD 卡 homebrew 目录运行。"
